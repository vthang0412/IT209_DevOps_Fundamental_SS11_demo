spring.application.name=student-api

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/student_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:student_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:student_pass}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8080